name: Release

# Publishes a GitHub release with both browser packages, tagged v<package.json version>.
# Run it from the Actions tab (Run workflow), or push a matching tag such as v1.0.0.
# The notes come from docs/releases/<tag>.md.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($tag)" >&2
            exit 1
          fi
          test -f "docs/releases/$tag.md" || { echo "Missing docs/releases/$tag.md" >&2; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Unit tests
        run: npm test
      - name: Build and package
        run: npm run package
      - name: Lint Firefox build
        run: npm run lint:firefox
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Safari is built and signed by each user, so only Chrome and Firefox are attached.
          gh release create "$TAG" dist/volume-tabs-chrome-*.zip dist/volume-tabs-firefox-*.zip \
            --target "$GITHUB_SHA" \
            --title "Volume Tabs $TAG" \
            --notes-file "docs/releases/$TAG.md"
